{% extends "base.html" %}

{% block title %}Rejestracja — Tracker{% endblock %}

{% block content %}
<h1>Utwórz konto</h1>
<p>Załóż konto, żeby zapisywać swoje pomiary i posiłki.</p>

<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Zarejestruj</button>
</form>

<p>Masz już konto? <a href="{% url 'login' %}">Zaloguj się</a></p>
{% endblock %}
