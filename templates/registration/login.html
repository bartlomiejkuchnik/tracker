{% extends "base.html" %}

{% block title %}Logowanie — Tracker{% endblock %}

{% block content %}
<h1>Witaj ponownie</h1>
<p>Zaloguj się do swojego trackera.</p>

<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Zaloguj</button>
</form>

<p>Nie masz jeszcze konta? <a href="{% url 'signup' %}">Utwórz konto</a></p>
{% endblock %}
