<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Tracker{% endblock %}</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 32px 16px;
      font-family: Arial, sans-serif;
      font-size: 18px;
      line-height: 1.5;
      color: #18302b;
      background:
        radial-gradient(ellipse at top left, #d8f3e8 0, transparent 45%),
        linear-gradient(135deg, #edf7f2, #e7eef9);
    }

    .container {
      width: min(100%, 760px);
      margin: 0 auto;
      padding: 32px;
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 24px;
      box-shadow: 0 16px 50px rgba(35, 65, 55, 0.12);
    }

    h1 {
      margin-top: 0;
      font-size: clamp(2rem, 6vw, 2.7rem);
      line-height: 1.15;
    }

    h2 {
      margin-top: 32px;
      font-size: 1.5rem;
    }

    p {
      margin: 12px 0;
    }

    a {
      color: #14795c;
    }

    form p {
      margin: 18px 0;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: 600;
    }

    input,
    select,
    textarea {
      display: block;
      width: 100%;
      min-height: 54px;
      padding: 12px 14px;
      border: 1px solid #bacbc4;
      border-radius: 12px;
      background: #fff;
      color: #18302b;
      font: inherit;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: 3px solid rgba(20, 121, 92, 0.2);
      border-color: #14795c;
    }

    button {
      min-height: 54px;
      padding: 12px 20px;
      border: 0;
      border-radius: 12px;
      background: #14795c;
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #0f624a;
    }

    .secondary-button {
      background: #e8f1ed;
      color: #18302b;
    }

    .secondary-button:hover {
      background: #dcebe4;
    }

    .columns {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 24px;
    }

    .section-card {
      min-width: 0;
      padding: 20px;
      border: 1px solid #e1ebe6;
      border-radius: 18px;
      background: #fbfdfc;
    }

    .entry-list {
      padding-left: 22px;
    }

    .entry-list li {
      margin: 10px 0;
      overflow-wrap: anywhere;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .errorlist {
      color: #b42318;
    }

    @media (max-width: 600px) {
      body {
        padding: 12px;
        font-size: 18px;
      }

      .container {
        padding: 22px 18px;
        border-radius: 18px;
      }

      .columns {
        grid-template-columns: 1fr;
      }

      button {
        width: 100%;
      }

      .top-bar form button {
        width: auto;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
